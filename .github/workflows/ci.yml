name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  changes:
    # Documentation-only changes (Markdown, docs/, CITATION.cff, LICENSE, NOTICE) skip every step of the jobs below:
    # the jobs still report, so the required checks pass, but nothing is installed or run. Releases and manual runs
    # always test.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) range="${{ github.event.pull_request.base.sha }} ${{ github.sha }}" ;;
            push) range="${{ github.event.before }} ${{ github.sha }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only $range) || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }   # e.g. a new branch
          echo "$files"
          n=$(echo "$files" | grep -v -E '\.md$|^docs/|^CITATION\.cff$|^LICENSE$|^NOTICE$' | grep -c . || true)
          echo "code=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    name: py${{ matrix.python }} / tf${{ matrix.tensorflow }}
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sealed numbers were produced on TensorFlow 2.10; the newer rows check that the
          # deployed weights still load and score identically under Keras 3.
          - { python: "3.10", tensorflow: "2.10.1", numpy: "numpy<2" }
          - { python: "3.11", tensorflow: "2.15.1", numpy: "numpy<2" }
          - { python: "3.12", tensorflow: "2.18.1", numpy: "numpy>=2" }
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-python@v7
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow-cpu==${{ matrix.tensorflow }}" "${{ matrix.numpy }}" matplotlib
          python -m pip install --no-deps -e .
          python -m pip install pytest

      - name: Environment
        if: needs.changes.outputs.code == 'true'
        run: python -c "import sys, numpy, tensorflow as tf; print(sys.version); print('tf', tf.__version__, 'numpy', numpy.__version__)"

      - name: Tests
        if: needs.changes.outputs.code == 'true'
        env:
          VORTFOIL_EVAL_DATA: data/eval/holdout_targets.npz
        run: pytest -q tests/

      - name: Recorded scores through the command line
        if: needs.changes.outputs.code == 'true'
        run: python -m vortfoil.cli selfcheck --data data/eval/holdout_targets.npz

      - name: Build record
        if: needs.changes.outputs.code == 'true'
        run: python -m vortfoil.cli about

  wheel:
    name: wheel builds and installs clean
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: "3.11"
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean environment and self-check
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install "tensorflow-cpu==2.18.1"
          /tmp/clean/bin/pip install --no-deps dist/*.whl
          /tmp/clean/bin/python -m vortfoil.cli selfcheck --data data/eval/holdout_targets.npz
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.code == 'true'
        with:
          name: distributions
          path: dist/*

  app:
    # What users are told to run: uv installs the built wheel as a tool (its own Python 3.12, which has Tk; a system
    # Python, such as Ubuntu's, may lack it) with the newest
    # TensorFlow, numpy and matplotlib), then `vortfoil view` draws a case without a window and
    # `vortfoil app --selftest` opens the application window, runs one case and closes it (Linux under Xvfb).
    name: uv tool install (${{ matrix.os }})
    needs: [changes, wheel]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.code == 'true'
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0          # this action publishes full version tags only
        if: needs.changes.outputs.code == 'true'
      - name: Install the tool from the wheel
        if: needs.changes.outputs.code == 'true'
        run: |
          uv tool install --python 3.12 --managed-python dist/*.whl     # uv's own Python: it has Tk everywhere
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Viewer without a window
        if: needs.changes.outputs.code == 'true'
        run: |
          vortfoil view --airfoil 2412 --alpha 4 --Re 3e6 --h 0.05 --no-show --save view.png
          test -s view.png
      - name: Application window (self-test)
        if: needs.changes.outputs.code == 'true'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -q xvfb > /dev/null; run="xvfb-run -a"; else run=""; fi
          $run vortfoil app --selftest app_out --airfoil naca:2412
          test -s app_out/app_figure.png
      - name: Experimental window with a wing (self-test)
        if: needs.changes.outputs.code == 'true'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; else run=""; fi
          $run vortfoil_exp app --selftest app_exp --wing "Rectangular, AR 6" --V 25
          test -s app_exp/app_figure.png

  publish:
    # Uploads to PyPI only when a GitHub release is published; pushes and pull requests never do. PyPI trusted publisher:
    # repository SHRhie/VortFoil, workflow ci.yml, environment pypi. The tests, the clean-wheel check and the uv
    # installation on Windows, macOS and Linux must pass first.
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, wheel, app]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vortfoil
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Release tag matches the package version
        run: |
          v=$(ls dist/*.whl | sed -E 's/.*vortfoil-([^-]+)-.*/\1/')
          test "${{ github.event.release.tag_name }}" = "v$v" || { echo "tag ${{ github.event.release.tag_name }} is not v$v"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
