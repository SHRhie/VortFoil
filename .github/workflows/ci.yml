name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    name: py${{ matrix.python }} / tf${{ matrix.tensorflow }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sealed numbers were produced on TensorFlow 2.10; the newer rows check that the
          # deployed weights still load and score identically under Keras 3.
          - { python: "3.10", tensorflow: "2.10.1", numpy: "numpy<2" }
          - { python: "3.11", tensorflow: "2.15.1", numpy: "numpy<2" }
          - { python: "3.12", tensorflow: "2.18.1", numpy: "numpy>=2" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow-cpu==${{ matrix.tensorflow }}" "${{ matrix.numpy }}" matplotlib
          python -m pip install --no-deps -e .
          python -m pip install pytest

      - name: Environment
        run: python -c "import sys, numpy, tensorflow as tf; print(sys.version); print('tf', tf.__version__, 'numpy', numpy.__version__)"

      - name: Tests
        env:
          VORTFOIL_EVAL_DATA: data/eval/holdout_targets.npz
        run: pytest -q tests/

      - name: Recorded scores through the command line
        run: python -m vortfoil.cli selfcheck --data data/eval/holdout_targets.npz

      - name: Build record
        run: python -m vortfoil.cli about

  wheel:
    name: wheel builds and installs clean
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean environment and self-check
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install "tensorflow-cpu==2.18.1"
          /tmp/clean/bin/pip install --no-deps dist/*.whl
          /tmp/clean/bin/python -m vortfoil.cli selfcheck --data data/eval/holdout_targets.npz
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  publish:
    # Uploads to PyPI only when a GitHub release is published; pushes and pull requests never do. PyPI trusted publisher:
    # repository SHRhie/VortFoil, workflow ci.yml, environment pypi. The tests and the clean-wheel check must pass first.
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, wheel]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vortfoil
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Release tag matches the package version
        run: |
          v=$(ls dist/*.whl | sed -E 's/.*vortfoil-([^-]+)-.*/\1/')
          test "${{ github.event.release.tag_name }}" = "v$v" || { echo "tag ${{ github.event.release.tag_name }} is not v$v"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
