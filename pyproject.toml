[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vortfoil"
version = "2.0.0"
description = "A vortex-panel-informed neural operator for steady airfoil flow: surface pressure, lift, moment and the stagnation point from a predicted vortex sheet, drag and a lift correction from a parallel boundary-layer state"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"     # LICENSE and NOTICE are picked up by hatchling's default license-files
authors = [
  { name = "Sang-Hyun Rhie" },
  { name = "Gyuwon Kim" },
  { name = "Suhyeong Lim" },
  { name = "Jeongsu Lee" },
]
keywords = ["aerodynamics", "airfoil", "neural-operator", "surrogate-model", "vortex-panel", "xfoil"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.21",
  "tensorflow>=2.10",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
field = ["scipy>=1.7"]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
vortfoil = "vortfoil.cli:main"
vortfoil_exp = "vortfoil.cli:main_exp"      # the same, with the experimental 3D wing in the application window

[project.urls]
Homepage = "https://github.com/SHRhie/VortFoil"
Source = "https://github.com/SHRhie/VortFoil"

[tool.hatch.build.targets.wheel]
packages = ["src/vortfoil"]

# The application and the field route run on repository modules and weights; the wheel carries copies of them in the
# repository's layout under vortfoil/_release/ (see src/vortfoil/app.py), so `vortfoil` opens the window after
# `uv tool install vortfoil` without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"code/vortfoil_paths.py" = "vortfoil/_release/code/vortfoil_paths.py"
"code/view_airfoil.py" = "vortfoil/_release/code/view_airfoil.py"
"code/vortfoil_app.py" = "vortfoil/_release/code/vortfoil_app.py"
"code/wing_nll.py" = "vortfoil/_release/code/wing_nll.py"
"code/view_wing.py" = "vortfoil/_release/code/view_wing.py"
"code/wing_flow.py" = "vortfoil/_release/code/wing_flow.py"
"code/wing_view.html" = "vortfoil/_release/code/wing_view.html"
"code/field" = "vortfoil/_release/code/field"
"code/model/staged" = "vortfoil/_release/code/model/staged"
"weights/field_decoder_f0cm_s1.npz" = "vortfoil/_release/weights/field_decoder_f0cm_s1.npz"
"weights/airfrans_surface_tokens.npz" = "vortfoil/_release/weights/airfrans_surface_tokens.npz"
"weights/op1_supervised_eps0.50.scr_bd128.npz" = "vortfoil/_release/weights/op1_supervised_eps0.50.scr_bd128.npz"
"weights/op2_m325_BT.npz" = "vortfoil/_release/weights/op2_m325_BT.npz"


[tool.hatch.build.targets.sdist]
include = ["src/vortfoil", "pyproject.toml", "README.md", "LICENSE", "NOTICE", "DATA_LICENSES.md",
           "code/vortfoil_paths.py", "code/view_airfoil.py", "code/vortfoil_app.py", "code/wing_nll.py", "code/view_wing.py",
           "code/wing_flow.py", "code/wing_view.html", "code/field", "code/model/staged",
           "weights/field_decoder_f0cm_s1.npz", "weights/airfrans_surface_tokens.npz",
           "weights/op1_supervised_eps0.50.scr_bd128.npz", "weights/op2_m325_BT.npz"]
exclude = ["**/__pycache__"]
